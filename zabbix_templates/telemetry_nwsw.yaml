zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 'd50061b61306499a910513fdbebe6f66'
      name: 'Templates/Telemetry'
  templates:
    - uuid: 'dcfb906ebd064a2b883e6218e271ec13'
      template: 'Telemetry NWSW'
      name: 'Telemetry NWSW用テンプレート'
      description: 'Telemetry 中間サーバーから値を受け取る、NWSW(Cisco Nexus)用のテンプレート。各NWSWのホストに適用する。ホスト名は、Nexusのホスト名と、中間サーバーに登録したホスト名と一致させる。'
      groups:
        - name: 'Templates/Telemetry'
      items:
        - uuid: 'ff631bd6fdcd449c9c26b9791994c943'
          name: 'show ptp clock: clock-state'
          type: 'TRAP'
          key: 'show.ptp.clock.clock-state'
          delay: '0'
          trends: '0'
          value_type: 'CHAR'
          description: 'PTPのロック状態(show ptp clock の clock-state)'
          tags:
            - tag: 'component'
              value: 'ptp'
        - uuid: '82c87c2699ca4bddbdb293c1bb9670fb'
          name: 'show ptp clock: offset-from-master'
          type: 'TRAP'
          key: 'show.ptp.clock.offset-from-master'
          delay: '0'
          value_type: 'FLOAT'
          units: 'ns'
          description: 'マスターとの時刻差(show ptp clock の offset-from-master、単位はナノ秒)'
          tags:
            - tag: 'component'
              value: 'ptp'
        - uuid: 'b30e451687604ed6a7716b29de853189'
          name: 'show ptp parent: gm-id'
          type: 'TRAP'
          key: 'show.ptp.parent.gm-id'
          delay: '0'
          trends: '0'
          value_type: 'CHAR'
          description: 'グランドマスターのID(show ptp parent の gm-id)'
          tags:
            - tag: 'component'
              value: 'ptp'
        - uuid: '6f97d3fa70ec47d090ba0749a014a4ec'
          name: 'telemetry: 受信状態(1=正常、0=途絶)'
          type: 'TRAP'
          key: 'telemetry.status'
          delay: '0'
          description: 'その機器からのTelemetryの受信状態。1=正常、0=途絶。中間サーバーが一定間隔で送る。受信待ちの間は送られない。'
          tags:
            - tag: 'component'
              value: 'telemetry'
          triggers:
            - uuid: 'a84177dbacff4ef080fc608db4f23f97'
              expression: 'last(/Telemetry NWSW/telemetry.status)=0'
              name: '{HOST.NAME}: Telemetryの受信が途絶しました'
              priority: 'HIGH'
              description: '中間サーバーが、この機器からのTelemetryを途絶判定時間(既定値5分)受信していません。Nexusの送信設定と、管理ネットワークの経路を確かめてください。'
        - uuid: 'b82f40b95d964725990f59aa22b51506'
          name: 'telemetry: 最後の受信からの経過秒数'
          type: 'TRAP'
          key: 'telemetry.age'
          delay: '0'
          units: 's'
          description: '最後にTelemetryを受信してからの経過秒数。1度も受信しないまま途絶と判定した場合は、機器の登録、または中間サーバーのcollectorの起動からの経過秒数。'
          tags:
            - tag: 'component'
              value: 'telemetry'
        - uuid: '60f4d880e550406e878841286010e2d5'
          name: 'telemetry: show interface counters brief の受信状態(1=正常、0=途絶)'
          type: 'TRAP'
          key: 'telemetry.status[show interface counters brief]'
          delay: '0'
          description: 'show interface counters brief のTelemetryの受信状態。1=正常、0=途絶。中間サーバーの機器登録でチェックしたコマンドだけ送られる。'
          tags:
            - tag: 'component'
              value: 'telemetry'
          triggers:
            - uuid: '8b5f3144c7f14dbdbbc070eda9527282'
              expression: 'last(/Telemetry NWSW/telemetry.status[show interface counters brief])=0'
              name: '{HOST.NAME}: show interface counters brief のTelemetryの受信が途絶しました'
              priority: 'AVERAGE'
              description: '中間サーバーが、この機器からの show interface counters brief のデータを、途絶判定時間(既定値5分)受信していません。中間サーバーの機器登録でチェックを外したコマンドは、値が送られないため、障害になりません。'
        - uuid: 'ba9139caafba4201ba6448accc50d824'
          name: 'telemetry: show ptp brief の受信状態(1=正常、0=途絶)'
          type: 'TRAP'
          key: 'telemetry.status[show ptp brief]'
          delay: '0'
          description: 'show ptp brief のTelemetryの受信状態。1=正常、0=途絶。中間サーバーの機器登録でチェックしたコマンドだけ送られる。'
          tags:
            - tag: 'component'
              value: 'telemetry'
          triggers:
            - uuid: '895495d0911b4c2190709850bf5d2a57'
              expression: 'last(/Telemetry NWSW/telemetry.status[show ptp brief])=0'
              name: '{HOST.NAME}: show ptp brief のTelemetryの受信が途絶しました'
              priority: 'AVERAGE'
              description: '中間サーバーが、この機器からの show ptp brief のデータを、途絶判定時間(既定値5分)受信していません。中間サーバーの機器登録でチェックを外したコマンドは、値が送られないため、障害になりません。'
        - uuid: '59eb4185d4864d8f9b049033eb32ec34'
          name: 'telemetry: show ptp clock の受信状態(1=正常、0=途絶)'
          type: 'TRAP'
          key: 'telemetry.status[show ptp clock]'
          delay: '0'
          description: 'show ptp clock のTelemetryの受信状態。1=正常、0=途絶。中間サーバーの機器登録でチェックしたコマンドだけ送られる。'
          tags:
            - tag: 'component'
              value: 'telemetry'
          triggers:
            - uuid: '7c8818d88180459eb9ff35aa790a2e59'
              expression: 'last(/Telemetry NWSW/telemetry.status[show ptp clock])=0'
              name: '{HOST.NAME}: show ptp clock のTelemetryの受信が途絶しました'
              priority: 'AVERAGE'
              description: '中間サーバーが、この機器からの show ptp clock のデータを、途絶判定時間(既定値5分)受信していません。中間サーバーの機器登録でチェックを外したコマンドは、値が送られないため、障害になりません。'
        - uuid: 'de1a02727d4746bb8b31e2da8e6110bb'
          name: 'telemetry: show ptp parent の受信状態(1=正常、0=途絶)'
          type: 'TRAP'
          key: 'telemetry.status[show ptp parent]'
          delay: '0'
          description: 'show ptp parent のTelemetryの受信状態。1=正常、0=途絶。中間サーバーの機器登録でチェックしたコマンドだけ送られる。'
          tags:
            - tag: 'component'
              value: 'telemetry'
          triggers:
            - uuid: 'ecaf08b57ce840b1b4fefd806a72c754'
              expression: 'last(/Telemetry NWSW/telemetry.status[show ptp parent])=0'
              name: '{HOST.NAME}: show ptp parent のTelemetryの受信が途絶しました'
              priority: 'AVERAGE'
              description: '中間サーバーが、この機器からの show ptp parent のデータを、途絶判定時間(既定値5分)受信していません。中間サーバーの機器登録でチェックを外したコマンドは、値が送られないため、障害になりません。'
      discovery_rules:
        - uuid: '9563f9f230244c9eb97c909080164f53'
          name: 'show interface counters brief: 帯域監視のインターフェース'
          type: 'TRAP'
          key: 'show.interface.counters.brief.discovery'
          delay: '0'
          description: '中間サーバーのWebGUIで show interface counters brief 用に登録したインターフェースの一覧。中間サーバーが送る。'
          item_prototypes:
            - uuid: '11f4da9e14b84467b66d68d0fa21a70b'
              name: 'show interface counters brief: {#IFNAME} inrate1'
              type: 'TRAP'
              key: 'show.interface.counters.brief.inrate1[{#IFNUM}]'
              delay: '0'
              units: 'bps'
              description: '入力帯域(show interface counters brief の eth_inrate1 を bps に換算。30秒間の平均値)。インターフェース番号 {#IFNUM}。'
              tags:
                - tag: 'component'
                  value: 'bandwidth'
                - tag: 'interface'
                  value: '{#IFNAME}'
            - uuid: '63ad6612fa044e18aae8d074917ccb3b'
              name: 'show interface counters brief: {#IFNAME} outrate1'
              type: 'TRAP'
              key: 'show.interface.counters.brief.outrate1[{#IFNUM}]'
              delay: '0'
              units: 'bps'
              description: '出力帯域(show interface counters brief の eth_outrate1 を bps に換算。30秒間の平均値)。インターフェース番号 {#IFNUM}。'
              tags:
                - tag: 'component'
                  value: 'bandwidth'
                - tag: 'interface'
                  value: '{#IFNAME}'
        - uuid: '842aa82d2ed047ab9dcb9c5b0c5e1901'
          name: 'show ptp brief: PTPポート監視のインターフェース'
          type: 'TRAP'
          key: 'show.ptp.brief.discovery'
          delay: '0'
          description: '中間サーバーのWebGUIで show ptp brief 用に登録したインターフェースの一覧。中間サーバーが送る。'
          item_prototypes:
            - uuid: '7565a509615941e488dc139f347fdd86'
              name: 'show ptp brief: {#IFNAME} state'
              type: 'TRAP'
              key: 'show.ptp.brief.state[{#IFNUM}]'
              delay: '0'
              trends: '0'
              value_type: 'CHAR'
              description: 'PTPポート状態(show ptp brief の state)。インターフェース番号 {#IFNUM}。'
              tags:
                - tag: 'component'
                  value: 'ptp'
                - tag: 'interface'
                  value: '{#IFNAME}'
