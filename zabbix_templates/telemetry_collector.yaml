zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 'd50061b61306499a910513fdbebe6f66'
      name: 'Templates/Telemetry'
  templates:
    - uuid: '8fc8918465df4ff9abc0b121a6643f3b'
      template: 'Telemetry collector'
      name: 'Telemetry 中間サーバー用テンプレート'
      description: 'Telemetry 中間サーバー自身の状態を受け取るテンプレート。ホスト名「telemetry」のホストに適用する。'
      groups:
        - name: 'Templates/Telemetry'
      items:
        - uuid: 'a4a55d6bd0b443fb9c382f8b126a7d9e'
          name: 'telemetry collector: 受信件数(パケット数)'
          type: 'TRAP'
          key: 'telemetry.collector.received'
          delay: '0'
          description: '前回の送信から今回の送信までに受信したUDPパケットの数(破棄したものも含む)。'
          tags:
            - tag: 'component'
              value: 'telemetry'
          triggers:
            - uuid: '9676a2c74658464abf0a82b1936a1ffd'
              expression: 'nodata(/Telemetry collector/telemetry.collector.received,3m)=1'
              name: 'Telemetry 中間サーバーのcollectorが停止しています'
              priority: 'HIGH'
              description: '中間サーバーから自己監視値が3分間届いていません。collectorの停止、中間サーバーの停止、または中間サーバーとZabbixの間の通信の異常が考えられます。'
        - uuid: '684c4aa04fd346a5b457ba2de0cc7d25'
          name: 'telemetry collector: 破棄件数:未登録の送信元(パケット数)'
          type: 'TRAP'
          key: 'telemetry.collector.dropped[unknown_source]'
          delay: '0'
          description: '前回の送信から今回の送信までの破棄件数:未登録の送信元(パケット数)。'
          tags:
            - tag: 'component'
              value: 'telemetry'
        - uuid: 'cd71a6dbc5954527b87130c777ea89a8'
          name: 'telemetry collector: 破棄件数:壊れたデータ(パケット数)'
          type: 'TRAP'
          key: 'telemetry.collector.dropped[invalid_data]'
          delay: '0'
          description: '前回の送信から今回の送信までの破棄件数:壊れたデータ(パケット数)。'
          tags:
            - tag: 'component'
              value: 'telemetry'
        - uuid: '7af1fcd2875149d3ab8888d929d71f90'
          name: 'telemetry collector: 破棄件数:4つ以外のコマンド(パケット数)'
          type: 'TRAP'
          key: 'telemetry.collector.dropped[unknown_command]'
          delay: '0'
          description: '前回の送信から今回の送信までの破棄件数:4つ以外のコマンド(パケット数)。'
          tags:
            - tag: 'component'
              value: 'telemetry'
        - uuid: '0fbc31ef3c45475a80ef8356af17216b'
          name: 'telemetry collector: 破棄件数:送信待ちキューが満杯(値の数)'
          type: 'TRAP'
          key: 'telemetry.collector.dropped[queue_full]'
          delay: '0'
          description: '前回の送信から今回の送信までの破棄件数:送信待ちキューが満杯(値の数)。'
          tags:
            - tag: 'component'
              value: 'telemetry'
        - uuid: 'bd0e27b9d8654c53b8b092ebee9853f4'
          name: 'telemetry collector: 破棄件数:Zabbixに接続できない(値の数)'
          type: 'TRAP'
          key: 'telemetry.collector.dropped[zabbix_unreachable]'
          delay: '0'
          description: '前回の送信から今回の送信までの破棄件数:Zabbixに接続できない(値の数)。'
          tags:
            - tag: 'component'
              value: 'telemetry'
        - uuid: 'e444e5a8c5f24f6fb1d242fc46319337'
          name: 'telemetry collector: 対象外の件数(パケット数)'
          type: 'TRAP'
          key: 'telemetry.collector.skipped'
          delay: '0'
          description: '機器登録でチェックを外したコマンドのデータの数。エラーではない。'
          tags:
            - tag: 'component'
              value: 'telemetry'
        - uuid: '6114c7d0bc914534ab021c2101c34f9a'
          name: 'telemetry collector: Zabbix送信の成功件数(値の数。LLD用データと自己監視値を含む)'
          type: 'TRAP'
          key: 'telemetry.collector.sent.ok'
          delay: '0'
          description: 'Zabbixが受け付けた値の数。監視データに加えて、LLD用データと自己監視値の送信も含む。'
          tags:
            - tag: 'component'
              value: 'telemetry'
        - uuid: '4e3f7d5e25a7426a9fd01f90ee0a657f'
          name: 'telemetry collector: Zabbix送信の失敗件数(値の数。LLD用データと自己監視値を含む)'
          type: 'TRAP'
          key: 'telemetry.collector.sent.failed'
          delay: '0'
          description: 'Zabbixが受け付けなかった値の数(Zabbix側にアイテムがない、など)。LLD用データと自己監視値の送信も含む。'
          tags:
            - tag: 'component'
              value: 'telemetry'
        - uuid: 'd0e7011b564345c695004c1228ef20d5'
          name: 'telemetry collector: 送信待ちキューの滞留量(値の数)'
          type: 'TRAP'
          key: 'telemetry.collector.queue.size'
          delay: '0'
          description: '送信待ちキューに残っている値の数。'
          tags:
            - tag: 'component'
              value: 'telemetry'
        - uuid: '8e45aca61a7f4560a0c52dc47f10c1b5'
          name: 'telemetry collector: 登録機器数'
          type: 'TRAP'
          key: 'telemetry.collector.devices.total'
          delay: '0'
          description: '中間サーバーに登録されている機器の台数。'
          tags:
            - tag: 'component'
              value: 'telemetry'
        - uuid: '9882f59767304190acd8e1cec4562962'
          name: 'telemetry collector: 途絶中の機器数'
          type: 'TRAP'
          key: 'telemetry.collector.devices.stale'
          delay: '0'
          description: '受信が途絶している機器の台数。'
          tags:
            - tag: 'component'
              value: 'telemetry'
