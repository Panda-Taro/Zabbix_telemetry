{% extends "base.html" %}
{% block title %}ログイン{% endblock %}
{% block outside %}
<section class="login-box">
  <h1 class="login-title">{{ system_name }}</h1>
  {% if message %}
  <p class="message message-error" role="alert">{{ message }}</p>
  {% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="csrf" value="{{ login_csrf }}">
    <label class="form-label" for="username">ユーザー名</label>
    <input class="form-input" type="text" id="username" name="username" autocomplete="username" autofocus required>
    <label class="form-label" for="password">パスワード</label>
    <input class="form-input" type="password" id="password" name="password" autocomplete="current-password">
    <button type="submit" class="button button-primary">ログイン</button>
  </form>
</section>
{% endblock %}
